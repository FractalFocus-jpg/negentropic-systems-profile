name: EXP26C MLPerf macOS Model-Family Triad Binding A8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exp26c-mlperf-macos-model-family-triad-a8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triad-binding:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Execute three-model-family Metal device binding
        shell: bash
        run: |
          set +e
          mkdir -p evidence/exp26c /tmp/exp26c_a8/data /tmp/exp26c_a8/temp
          python3 - <<'PY'
          import datetime, hashlib, json, os, re, stat, subprocess, urllib.request, zipfile
          from pathlib import Path

          stable_id='LT-UOS-EIDOLEN-EXP26C-MLPERF-MACOS-MODEL-FAMILY-TRIAD-BINDING-A8-20260818'
          parent='LT-UOS-EIDOLEN-EXP26C-MLPERF-MACOS-ACCELERATOR-BINDING-A7-R2-20260818'
          parent_terminal='PASS_EXP26C_A7_R2_MACOS_ACCELERATOR_RESOURCE_BINDING__PARENT_FAIL_PRESERVED__APPLE_SILICON_ARM64_AND_METAL_VISIBLE__OFFICIAL_MLPERF_BINARY_AND_THREE_METAL_CONFIGS_HASH_BOUND__LLAMA31_METAL_DEVICE_ENUMERATED__ONE_ACCELERATOR_STACK_RESOURCE_BOUND__NO_MODEL_SCORING__OWNER_CONTROLLED_GITHUB_PROVIDER_ONLY__EXTERNAL_0_OF_12'
          work=Path('/tmp/exp26c_a8')
          receipt=Path('evidence/exp26c/mlperf_macos_model_family_triad_a8.json')
          term_path=Path('evidence/exp26c/mlperf_macos_model_family_triad_a8_terminal.txt')
          out={'stable_id':stable_id,'parent_id':parent,'parent_terminal':parent_terminal,'record_type':'PROVIDER_HOSTED_THREE_MODEL_FAMILY_ONE_ACCELERATOR_BINDING_ONLY','timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'github_sha':os.environ.get('GITHUB_SHA'),'scientific_execution':False,'three_material_provider_stacks':False,'independent_custody':False,'unaffiliated_execution':False,'independent_scoring_adjudication':False,'strict_external_role_coverage':'0/12'}
          terminal=None
          try:
            machine=subprocess.run(['uname','-m'],capture_output=True,text=True,timeout=30).stdout.strip()
            sp=subprocess.run(['system_profiler','SPHardwareDataType','SPDisplaysDataType'],capture_output=True,text=True,timeout=120); sptext=sp.stdout+sp.stderr
            out['machine']=machine; out['system_profiler_excerpt']=sptext[:16000]; out['apple_silicon_visible']=bool(re.search(r'Apple M[1-9]|Chip:\s*Apple',sptext,re.I))
            req=urllib.request.Request('https://api.github.com/repos/mlcommons/mlperf_client/releases/latest',headers={'User-Agent':'EIDOLEN-EXP26C-A8'})
            with urllib.request.urlopen(req,timeout=60) as r: release=json.load(r)
            asset=next(a for a in release.get('assets',[]) if a.get('name','').lower().endswith('macos.zip'))
            zpath=work/asset['name']; urllib.request.urlretrieve(asset['browser_download_url'],zpath); zb=zpath.read_bytes(); out['asset_name']=asset['name']; out['asset_sha256']=hashlib.sha256(zb).hexdigest(); out['asset_size']=len(zb)
            exdir=work/'extracted'; exdir.mkdir(exist_ok=True)
            with zipfile.ZipFile(zpath) as z:z.extractall(exdir)
            candidates=[]
            for p in exdir.rglob('*'):
              if p.is_file() and 'mlperf' in p.name.lower():
                ft=subprocess.run(['file',str(p)],capture_output=True,text=True).stdout
                if 'Mach-O' in ft: candidates.append((p,ft))
            exe=sorted(candidates,key=lambda x:len(str(x[0])))[0][0]; exe.chmod(exe.stat().st_mode|stat.S_IXUSR|stat.S_IXGRP|stat.S_IXOTH); eb=exe.read_bytes(); out['executable_sha256']=hashlib.sha256(eb).hexdigest(); out['executable_size']=len(eb)
            v=subprocess.run([str(exe),'--version'],capture_output=True,text=True,timeout=120); out['version_exit_code']=v.returncode; out['version_output']=(v.stdout+v.stderr).splitlines()
            configs={
              'llama31':('Llama 3.1 8B','https://raw.githubusercontent.com/mlcommons/mlperf_client/main/data/configs/vendors_default/llm/Llama3.1/macOS_llamacpp-Metal_GPU.json'),
              'phi4mini':('Phi 4 Mini','https://raw.githubusercontent.com/mlcommons/mlperf_client/main/data/configs/vendors_default/llm/phi4mini/macOS_llamacpp-Metal_GPU.json'),
              'qwen3':('Qwen 3 8B','https://raw.githubusercontent.com/mlcommons/mlperf_client/main/data/configs/vendors_default/llm/extended/qwen3/macOS_llamacpp-Metal_GPU.json')}
            results={}
            for key,(family,url) in configs.items():
              p=work/(key+'.json'); req=urllib.request.Request(url,headers={'User-Agent':'EIDOLEN-EXP26C-A8'}); b=urllib.request.urlopen(req,timeout=60).read(); p.write_bytes(b); j=json.loads(b); ep=j['Scenarios'][0]['ExecutionProviders'][0]
              cmd=[str(exe),'-c',str(p),'--enumerate-devices','--temp-dir',str(work/'temp'),'-d',str(work/'data')]
              try:
                r=subprocess.run(cmd,capture_output=True,text=True,timeout=480); txt=r.stdout+r.stderr; visible=(r.returncode==0 and bool(re.search(r'Metal|GPU|device|Apple',txt,re.I)))
                results[key]={'model_family':family,'config_url':url,'config_sha256':hashlib.sha256(b).hexdigest(),'execution_provider':ep.get('Name'),'execution_config':ep.get('Config'),'exit_code':r.returncode,'device_visible':visible,'output':txt.splitlines()[:1000]}
              except subprocess.TimeoutExpired as e:
                results[key]={'model_family':family,'config_url':url,'config_sha256':hashlib.sha256(b).hexdigest(),'execution_provider':ep.get('Name'),'execution_config':ep.get('Config'),'timeout':True,'device_visible':False,'error':repr(e)}
            out['model_family_bindings']=results
            all_bound=all(x.get('device_visible') for x in results.values())
            out['three_model_families_bound_to_one_common_stack']=all_bound
            out['common_stack']={'runtime':'llama.cpp','backend':'Metal','hardware':'Apple Silicon GPU','provider_host':'GitHub Actions macos-15'}
            if v.returncode==0 and all_bound:
              terminal='PASS_EXP26C_A8_MACOS_MODEL_FAMILY_TRIAD_BINDING__LLAMA31_PHI4MINI_QWEN3_OFFICIAL_METAL_CONFIGS_EACH_ENUMERATE_APPLE_DEVICE__THREE_MODEL_FAMILIES_ONE_COMMON_ACCELERATOR_STACK_BOUND__NO_MODEL_SCORING__NOT_THREE_MATERIAL_PROVIDER_STACKS__OWNER_CONTROLLED_PROVIDER_ONLY__EXTERNAL_0_OF_12'
            else:
              terminal='FAIL_EXP26C_A8_MACOS_MODEL_FAMILY_TRIAD_BINDING__ONE_OR_MORE_OFFICIAL_METAL_CONFIG_DEVICE_GATES_INCOMPLETE__NO_MODEL_SCORING__NOT_THREE_MATERIAL_PROVIDER_STACKS__EXTERNAL_0_OF_12'
          except Exception as e:
            out['error']=repr(e); terminal='ERROR_EXP26C_A8_MACOS_MODEL_FAMILY_TRIAD_BINDING__FIRST_ERROR_PRESERVED__NO_SAME_ID_RETRY__EXTERNAL_0_OF_12'
          out['terminal']=terminal; out['claim_ceiling']='OWNER_CONTROLLED_PROVIDER_HOSTED_THREE_MODEL_FAMILY_RESOURCE_BINDING_ON_ONE_COMMON_APPLE_METAL_STACK_ONLY__NO_MODEL_SCORING__NO_THREE_MATERIAL_PROVIDER_STACKS__NO_EQUAL_BUDGET_TRIAL__NO_HIDDEN_TASKS__NO_INDEPENDENT_CUSTODY__NO_UNAFFILIATED_ADJUDICATION__NO_PRODUCTION_SUPERIORITY__NO_FULL_UNIVERSALITY'
          receipt.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); term_path.write_text(terminal+'\n')
          PY

      - name: Commit immutable A8 provider receipt
        if: always()
        shell: bash
        run: |
          git config user.name 'eidolen-provider-preflight'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/exp26c/mlperf_macos_model_family_triad_a8.json evidence/exp26c/mlperf_macos_model_family_triad_a8_terminal.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record EXP26C MLPerf macOS model-family triad A8'
          git push origin HEAD:main
